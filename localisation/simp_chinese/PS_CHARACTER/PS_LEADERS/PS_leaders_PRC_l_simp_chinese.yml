 PRC_HuJintao: "胡 锦涛"
 PRC_HuJintao_desc: "出身一般的胡锦涛貌似并不能和其他人比较，没有党内背景、没有斗争历程，这使他在党内似乎并没有那么突出，但就是不突出才在后面的乱世内保全了他。有人说他的高学历却为他的前途打开了大门，所以他才能做到比他人更好的结果。在后面的文化大革命中，较为温和的他也没有被人所忌惮、猜疑，仅仅只是接受了几年劳动就移官别处并且从此政途畅通无阻。\n\n但即使如此，他的足迹依然遍布了中国最贫困的、最落后、最困苦的西方：甘肃、贵州、西藏……这种经历并没有让他不满亦或是悲观，反倒让他的理论变得慈爱，温和的他将自己的全身心交给了国家。\n\n在不久前的战争后，这位出生一般的党员从疲惫不堪的江泽民的手里接下了总书记的位子，他还能否带领伟大共和国继续向前走呢？"
 PRC_JiangZemin: "江 泽民"
 PRC_JiangZemin_desc: "在近代末不长不短的屈辱史内，江泽民看到过日寇的无情与暴虐；见证过自己的祖国走向那极具幻想亦是极其伟大的社会主义；也经历过文革的磨练。而现在正在参与所谓“改革开放”的伟大历史。\n\n似乎从他参加的学生运动的那年那天那时起，江泽民就将自己的满腔热血与一生的力量都献给了自己伟大祖国的不朽将来，亦或更早的时候。但不可置否的是，这位同志的意志是十分坚定的：他将穷尽一生去建设自己的国家。\n\n从学生运动的一员，到莫斯科的大学研究国家所需的科技，再成为政坛的一位日益强大的政治高手，他苦过、累过但他绝对没有想过放弃。他常常在想：若是干部都放弃了，那么什么时候中国才能屹立于世界之林而永远不倒呢？\n\n无论是在任何时期，他都为中国而努力奋斗；不管是在研究厂还是在中南海，他都全心全意为人民服务。\n\n目前中国的状况不容乐观，江主席到底能否带领人民政府永远不倒呢？"
