 PRC_YuYongbo: "于 永波"
 PRC_ZengQinghong: "曾 庆洪"
 PRC_ZengQinghong_desc: "1961年七月，曾家刚刚诞下了一子，这对曾家倒是件喜事。或许曾家曾幻想过一日升天，但若有人现在告诉他们:刚刚的这一位幼儿会身居高位、实现阶级跃迁，他们最多会一笑而过。\n\n生于特殊的年代，立志做知识分子的曾庆洪也下过乡做知青、当过修理工。但幸运的是他并没有被打到，而是在广州国有汽车企业一步一步高升。\n\n广东孕育了曾庆洪，而他近乎一辈子都在广东工作。正因如此，在1978年震惊全国的大改革也把他推到了台前：从最基层到技术中心、从文艺科到前往党校深造，这一段吃的苦只有自己知道，现在要做的只不过是咽下苦涩的过去而迎接未来罢了。"
