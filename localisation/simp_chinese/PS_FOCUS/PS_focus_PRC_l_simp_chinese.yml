 # 国策的ID为 TAG_FOCUSTREEID_PROJECT_ID 
 
 
 
 # PRC 00
 # 軍改國策 MR
 PRC_00_MR_01: "海湾战争的警钟" #######
 PRC_00_MR_01_desc: "海湾战争中，美国的大量新式武器震惊了全世界。同样的，也震惊了处于东方的我们。党中央意识到，一个现代化的解放军是国家独立安全的前提保障，我们必须依靠更为强大的军事力量来稳固人民政权，军事改革迫在眉睫。"
 
 PRC_00_MR_02: "设立总装备部"
 PRC_00_MR_02_desc: "现代战争需要完善的装备体系，现有的装备制度完全无法适应，我们需要一个新的部门，这个部门能统一全军的发展计划，装备新的武器，使用新的体系，来适应新时期的战争需要。"
 
 PRC_00_MR_03: "禁止军队经商"
 PRC_00_MR_03_desc: "虽然军队经商是几年前中央军委为了经济建设专门放开过的，虽然军队经商也缓解了我们财政上的不足，也促进了市场的发展。但我们不得不承认的是，军队经商的利只能维持一时，而之后的弊端会越来越大，前不久的两个案子就是最直接的证据。军人的本质是打仗，什么经商之类腐蚀军队战斗力的全给我见鬼去吧！"
 
 PRC_00_MR_04: "世纪交替的军改"
 PRC_00_MR_04_desc: "千禧年将至，以北约为首的西方国家失去了苏联的威胁，我们不得不重视这个难以想象的战斗力。眼下，我国经济刚刚开始有起色，犯罪率也开始降低，我们的军改任务越来越重，国外的武装势力正对我们虎视眈眈，我们必须在这个特殊的时候完成我们的军事改革。"
 
 PRC_00_MR_05: "推进指挥自动化"
 PRC_00_MR_05_desc: "如果士兵是一只部队的身体，那么指挥官就是他的脑袋。传统的指挥方式效率低下，且遇到突发情况难以应对，指挥链的自动化不仅能加快我们的指挥效率，还能为我们的军队战力带来大幅度提升。"
 
 PRC_00_MR_LAND_01: "陆军改革"
 PRC_00_MR_LAND_01_desc: "1991年的海湾战争如同一面棱镜，折射出工业时代战争与信息时代战争的鸿沟。它不仅惊醒了中国的军事改革，更重塑了国防现代化的底层逻辑：打赢战争不再取决于“有多少坦克”，而在于“有多少不可见的东西在运转”。中国下定决心进行陆军军事改革，这次改革以适应现代战争的特点为目标。不再追求以量取胜，而追求精益求精，裁军的同时是向着全面半机械化与信息化建设铺路。中国陆军正式从“国土防卫”走向“全域慑战”。"
 
 PRC_00_MR_MECH_01: "全面推进机械化"
 PRC_00_MR_MECH_01_desc: "为适应现代战争需求，国家决定全面推进陆军机械化建设，提升部队快速机动和火力打击能力。通过优化装备结构，逐步淘汰老旧装备，实现机械化部队的全域覆盖和高效协同作战。"
 
 PRC_00_MR_MECH_02_L: "投产04式步兵战车"
 PRC_00_MR_MECH_02_L_desc: "为满足部队装备需求，国家启动04式步兵战车扩产计划。该战车具备良好的机动性和防护能力，适用于多种复杂地形作战。通过扩大生产规模，确保前线部队装备充足，同时推动相关产业链升级，提升国产化率。"
 
 PRC_00_MR_MECH_02_R: "改进86A步兵战车"
 PRC_00_MR_MECH_02_R_desc: "在86型基础上，国家立项改进86A型步兵战车，重点提升其火力系统、防护性能和信息化水平。改进后的战车将配备新型武器系统和数字化指挥系统，显著增强战场生存能力和作战效能，为部队提供更强大的火力支援。"
 
 PRC_00_MR_MECH_02: "扩产96式坦克"
 PRC_00_MR_MECH_02_desc: "96式坦克作为陆军主力装备，其扩产计划旨在进一步提升装甲部队的战斗力。通过规模化生产和技术优化，降低制造成本，确保装备供应稳定。同时，加强人员培训，保障坦克部队的快速形成战斗力。"
 
 PRC_00_MR_MECH_03: "初步生产99式坦克"
 PRC_00_MR_MECH_03_desc: "为打造现代化装甲力量，国家启动99式坦克的初步生产。99式坦克集成了先进火力、防护和机动技术，代表国内坦克制造的最高水平。通过小批量生产和技术验证，逐步完善生产线，为未来大规模列装奠定基础。"
 
 PRC_00_MR_LAND_02: "完善新世纪陆军体系"
 PRC_00_MR_LAND_02_desc: "这是中国陆军现代化转型的关键节点，其改革举措既是对海湾战争信息化作战模式的回应，也是应对国内安全环境与国防资源约束的战略调整。此次改革的核心是“精兵合成、提质增效”，通过编制重组、装备升级和制度创新，将为21世纪陆军体系建设奠定基础。“改革从无坦途，但强军必涉深水。” 其真正的核心，在于用一场自我革命证明：大国陆军的尊严，不在兵员之众，而在变革之勇。"
 
 PRC_00_MR_QBB_01: "加强轻步兵训练"
 PRC_00_MR_QBB_01_desc: "中国加强轻步兵训练以应对现代战争复杂化、全域化的核心举措，当美军执着于“重装甲合成营”时，中国轻步兵正以全新的姿态证明，未来战场的胜负手，仍在于单兵与智能装备融合后迸发的创造力与韧性。这既是井冈山精神的数字觉醒，更是“以人制器”哲学对“唯武器论”的终极超越。其本质是信息化时代通过科技赋能对群众性战争思想的创造性发展。毛主席“真正的铜墙铁壁是群众”的论断正赋予全新内涵。"
 
 PRC_00_MR_QB_81: "扩产81式自动步枪"
 PRC_00_MR_QB_81_desc: "中国在二十世纪九十年代扩大生产81式自动步枪是应对边境冲突、军队换装需求和国防战略调整的关键举措。81式自动步枪是中国轻武器发展史上的里程碑式装备，在八十年代到九十年代期间作为解放军主力步枪，其设计融合了苏系武器可靠性与西方人机工程理念。在“简单可靠”与“精准高效”间取得完美平衡。其在军队中大规模扩产也正在验证着中国国防工业是否具有强大的大规模动员能力。"
 
 PRC_00_MR_QB_95: "改进95式自动步枪"
 PRC_00_MR_QB_95_desc: "95式自动步枪自1997年列装以来，其无托设计虽提升便携性，但也暴露人机功效、扩展性等问题。中国通过持续迭代升级，及发展全新191枪族实现技术突破。95式的改进是中国军工“问题驱动创新”的典范从“武器量产”转向“装备集成”，它的改进证明：武器成熟度从不是图纸决定的，而是战场与工厂间千万次反馈循环铸就的。“战场上1%的问题足以导致100%失败”。95系列的改进，正是中国军工以“战场需求”为锚点，将战士生命与胜利权重置于技术自负之上的缩影。或许它不是“完美步枪”，但无疑是中国特色单兵武器进化的必由之路。"
 
 PRC_00_MR_QBB_02: "强化基层指挥组织"
 PRC_00_MR_QBB_02_desc: "基层指挥组织强化改革的真正核心，在于将指挥神经末梢打造成决策尖刀——今日高原边防班长用平板电脑召唤火力支援的场景，正是这场变革能够跨越时空的回响。“军队改革必然会触及既得利益，但强军之路从无坦途。”"
 
 PRC_00_MR_QBB_03: "强化民兵训练与预备役体系"
 PRC_00_MR_QBB_03_desc: "强化民兵训练与预备役体系是我国国防动员体系现代化建设的核心任务，是应对安全威胁与国力限制的务实选择，在枷锁当中蓄力。在裁军阵痛期，后备力量要甘当兜底的网。这张网虽显陈旧，却是在为中国现代陆军未来的飞跃保留火种。"
 
 PRC_00_MR_AIR_01: "空军革新"
 PRC_00_MR_AIR_01_desc: "外媒曾讥讽：“中国人连电传操纵系统是什么都不知道。”而在1998，这将是中国空军把命运攥进自己手中的元年，中央军委决定对空军技术进行革新，北京与华盛顿的战机代差，将从30年缩短至20年。中华民族此刻仰望长空，每一道航迹都在诉说曾经孤勇的起飞，终将化作星河璀璨。"
 
 PRC_00_MR_AIR_L: "加速研发歼-10"
 PRC_00_MR_AIR_L_desc: "1981年底，邓公在财政收入不足千亿的困境下，批准5亿元启动“新歼项目”，批示：“花钱不多，拟同意”。当试飞员雷强跨入编号1001的歼-10座舱，塔台指令下达，俄制AL-31FN引擎嘶吼，鸭翼撕裂气流——20分钟后，他带着泪痕亲吻大地：“我们把争气机飞出来了！”这是从“中国人飞不了三代机”到世界第五大航空强国的惊天一跃。当雷强驾机刺破1998年的阴云，他托起的不仅是一架战机，更是一个国家冲破技术铁幕的尊严。"
 
 PRC_00_MR_AIR_R: "引进苏27"
 PRC_00_MR_AIR_R_desc: "1994年黄海对峙黄海对峙，中美战机暴露巨大代差。在1998·苏-27入华，中国空军的“代际跃升”时刻，用罐头换来的长空利剑，如何改写亚太天空？当1998年沈阳厂组装的苏-27刺破云霄，它承载的不仅是24吨钢铁，更是一个民族对制空权的救赎，它将填平二代机到三代机的代际鸿沟。"
 
 PRC_00_MR_AIR_02: "国产化战机配件"
 PRC_00_MR_AIR_02_desc: "面对西方技术封锁和俄制装备的“卡脖子”困境，中国在战机配件领域正寻求从仿制到自主创新的突破性跨越。在航电与武器接口领域打破俄制系统枷锁，复合材料与风挡玻璃攻坚，为自主创新奠定基石。这是一场没有硝烟的“后勤战争”，从刹车盘到螺丝钉，中国用逆向创新撕开封锁网，证明“小配件决定大装备”的硬道理。西方封锁什么，我们就把它做成白菜价！"
 
 PRC_00_MR_AIR_03: "扩产新式国产战机"
 PRC_00_MR_AIR_03_desc: "多款新型国产战机进入量产或首飞阶段，标志着中国空军装备自主化进程加速，中国自主研制的第三代战斗机歼-10首飞成功。该机采用鸭式布局、翼身融合设计和数字电传飞控系统。这不仅快速提升了空军战斗力，更推动中国航空工业从“技术追随”转向“自主创新”。"
 
 PRC_00_MR_AIR_04: "升级国土防空"
 PRC_00_MR_AIR_04_desc: "1996台海危机暴露出防空领域致命短板，美军评估认为“中国防空网停留在1960年代水平，突破仅需72小时。”国土防空急需进行技术攻坚，这是钢铁天网上的民族尊严，更是“中国人终将主宰自己天空”的誓言。\n\n“那年我们用俄制导弹撑起屏障，今天我们用中国雷达定义未来。”\n——东部战区防空旅标语"
 
 PRC_00_MR_AIR_05: "追赶先进空军体系"
 PRC_00_MR_AIR_05_desc: "1991年，美军F-117隐身战机如幽灵般穿透伊拉克防空网，42天摧毁80%军事目标。带给彼时中国空军属于海湾战争的灵魂震撼。刘华清将军疾呼：“我们与美军的差距，不是武器代差，而是时代差！”中国空军通过体系对抗时代差，在技术封锁、代差鸿沟、体系滞后的三重围困中，以孤勇之姿发起冲锋，当歼-10刺破温江机场的阴云，托起了一个民族对制空权的救赎，当S-300的雷达波扫过台海，它宣告的是“西方神话”的终结，当太行发动机的轰鸣响彻戈壁，它点燃的是自主创新的火种。"
 
 PRC_00_MR_SEA_01: "近海海军"
 PRC_00_MR_SEA_01_desc: "我国目前海军实力薄弱，有着各种重要短板。舰艇种类存在严重失衡。海湾战争中伊拉克面对美国海军的无力以及南海主权问题受到严重威胁也提醒了我们：海军在现代战争中的作用比我们想象中的更为重要。如果我们仍旧轻视海军，那么我们的本土便会成为敌人训练海军登陆的最佳场地。敌军也会肆意地切断大陆与台湾之间的联系。近些年来美国与日本的咄咄逼人在不断的提醒我们：剩下的时间不多了，我们必须尽快完成现代化海军的建设。否则“有海无防”只会让我们沦为下一个伊拉克！"
 
 PRC_00_MR_SEA_02: "近海防御"
 PRC_00_MR_SEA_02_desc: "海湾战争中伊拉克被美国海军封锁，导致其在战争中迅速溃败，而我国领导人也意识到一点：在面对美帝国主义的入侵时，必需拿起独属于我们的刀刃反抗。值得庆幸的是经过一系列的海军改革，我国舰艇的各个性能都得到了显著的提升。接下来我们只需要提出一个合理的战术并加以应用，那么我国便可以跻身海军强国。近些年来我国将近海防御纳入全军战略，并提供了详细的解析即：捍卫主权，破坏敌方海军干扰。我们现阶段需要学会应用“近海防御”策略以促进现代化海军的建设，保卫中国领海的主权不受侵犯。建设起独属于我们的“钢铁长城”，让伊拉克的悲剧不会在东亚地区重现。"
 
 PRC_00_MR_SEA_03: "立足空潜快体系"
 PRC_00_MR_SEA_03_desc: "我国虽然进行了一系列的海军改革，但面对美国海军入侵时，我国那新兴海军依旧不堪一击。但我国新提出了“空潜快体系”利用机动性极高的潜艇以及快艇配合空军进行协同作战。这种方式不仅大大降低了近海防御的成本，而且这种机动防御能够使我国在面对敌方海军时更加有组织有纪律的予以反制。在海军改革的过程中，我国将空潜快体系所需要装备都予以扩产。因此我们能够空出大量装备进行武装我国的领海。在敌军出现时能够及时的捍卫主权，让甲午海战以及海湾战争的悲剧不会再一次的出现在我国海域，能够真正的中断中华民族的百年屈辱！"
 
 PRC_00_MR_SEA_L_01: "扩产歼轰7"
 PRC_00_MR_SEA_L_01_desc: "海湾战争中美国海军与空军的配合令我们瞠目结舌。这意味着现代化战争已经不再仅仅是个人英雄主义式的战斗，而是各个兵种协同作战的结果。由我国完全自主研发的超音速战斗轰炸机——歼轰七，填补了我国舰载轰炸机空缺。在反舰任务上其表现的十分出色，但由于我国工业实力较为薄弱，技术问题依旧困扰着我们。生产出来的歼轰七数量十分有限。我们应该加紧歼轰七的生产，以配合海军进行协同作战。促进现代化战争建设计划的实施。"
 
 PRC_00_MR_SEA_L_02: "改进039型潜艇"
 PRC_00_MR_SEA_L_02_desc: "039型潜艇是我国潜艇发展史上的里程碑，但仍有许多不足之处等着我们改进、如静音性差、AIP系统缺失以及可靠性不足等。如果我们不去革新而直接生硬运用于战场，就无异于自杀式袭击。我们需要对它进行一次大范围的改良，以便于适应今后战场上的风云变化。对它进行革新的过程中，我们也可以得出被“卡脖子”的核心技术问题的优秀解决方案。这种利大于弊的方案我们应当尽快完成！"
 
 PRC_00_MR_SEA_L_03: "扩产022型导弹艇"
 PRC_00_MR_SEA_L_03_desc: "我国新提出了“非对称作战理论”这种战术可以使我们在面对美国海军时不会手足无措。但这种战术对于导弹艇有着巨大的需求。对比于021型导弹艇，022型导弹艇的性能在各个方面上都有显著的提升。不仅在我国新提出的战术上有着卓越表现，而且它的造价低廉，适合扩产。而面对我国目前巨大的战略需求，以及为了弥补我国海军领域的空缺，应当对022型导弹艇进行扩产。以适应新时代海军战术的革新。"
 
 PRC_00_MR_SEA_R_01: "放眼未来"
 PRC_00_MR_SEA_R_01_desc: "不管是潜艇还是巡洋舰，都被划为近海防御的重要武器。但是我们应当将目光投向远处，不管是二战中还是二战以后的现代化战争，跨大洋的持续作战能力一直在主导着战场的局势。如果我们只能守卫大陆面前的一亩三分地，那么我们的海军将会受到持续性的压制。因此，我们应当尽快将建设航空母舰以及驱逐舰等等所具备远洋技术的舰艇的建设提上日程。将现代化海军建设计划作为我们的重要任务。"
 
 PRC_00_MR_SEA_R_02: "远洋技术储备"
 PRC_00_MR_SEA_R_02_desc: "信息化作为现代化战争的重要标志，在海湾战争中便具象化的体现出来。如果我们不能掌握信息化技术，那么我们也将无法踏入现代化海军强国的大门；技术代差也一直是困扰我们多年的问题，我们应当找到一个最合理的方案去打破代沟，否则我们与美国的差距只会愈来愈远……种种问题始终困扰着我们，在那一天来临之前，我们必须找到最佳的解决方案以真正的掌握远洋技术。"
 
 PRC_00_MR_SEA_R_03: "购买航母"
 PRC_00_MR_SEA_R_03_desc: "例如乌克兰近期宣布准备出售的“瓦良格”航母，如果我们买下并进行自主技术攻关，这就不仅能够提供宝贵的经验，而且在改装外国航母的过程中，我们也能够得出各种核心技术问题的解决方案，并大大缩短我国航母技术的积累周期。如果我国错失了此次良机，那么丢失的技术力将会化为美国悬在我们头上的一把利刃。因此我们必须进行广泛的航母购买，并进行自主技术攻关。以便于更高效的发展我国海军大业。"
 
 PRC_00_MR_BACKUP_01: "后勤体系精简化"
 PRC_00_MR_BACKUP_01_desc: "现代战争物资消耗剧增、保障时效性要求高，而传统后勤模式效率低、成本高，挤占核心军事资源。为提升军事后勤效率，我国积极推进后勤体系改革，改革核心是构建三军联勤与社会化保障机制：通过体制改革，成立总装备部，统筹装备全寿命管理，推行三军联勤；社会化保障，将非作战任务移交社会；规模精简，配合裁军政策，剥离冗余后勤职能。改革充分降低后勤成本、保障工作效率，为军队聚焦作战职能及后续信息化转型奠定基础。"
 
 PRC_00_MR_BACKUP_02: "强化二炮部队"
 PRC_00_MR_BACKUP_02_desc: "强化第二炮兵部队的改革主要源于应对复杂安全威胁和弥补军事短板的紧迫需求。此前台海危机暴露出常规威慑力的不足，需通过提升导弹部队的精确打击与战略反击能力，有效震慑分裂势力并拒止外部干预。同时，面对超级大国在制海权、制空权的绝对优势，我国海空军短期内难以全面抗衡，必须依托二炮发展中远程弹道导弹和巡航导弹，形成“不对称优势”，以低成本、高突防的导弹力量抵消对手技术装备优势。此外，通过整合导弹资源、优化核常兼备力量体系，可避免此前陆军“小二炮”与二炮职能重叠的弊端，实现全域慑战的战略目标。"
 
 PRC_00_MR_BACKUP_03: "综合后勤支援体系"
 PRC_00_MR_BACKUP_03_desc: "构建综合后勤支援体系旨在应对现代战争节奏快、消耗大的挑战，通过整合军民资源实现高效保障。该体系打破军种分割，推行一体化联勤，将通用后勤职能移交社会以减轻军队负担；依托信息技术建立“全资产可视系统”，消除资源与需求迷雾，实现精准配送；同时采用承包商参与、模块化编组等方式，提升战略投送与常态化战备能力，确保在预算紧缩环境下以最小资源满足多样化军事任务需求。"

 PRC_00_MR_BACKUP_L_01: "预算管理改革"
 PRC_00_MR_BACKUP_L_01_desc: "预算管理改革是精简后勤体系的重要部分，其核心是建立全流程经费管控体系。打破基数增长惯例，按任务实际需求核定经费；实施“分项限额管理”，对装备采购、物资储备、设施维护等大类支出设定刚性上限；设立军队财务结算中心，统一支付结算，压缩预算外开支；同步强化审计监督前置机制，对重大项目实行预算执行动态评估。从源头上杜绝了军兵种挤占挪用，并标准化成本定额，实现后勤支出可量化、可追溯管控。"
 
 PRC_00_MR_BACKUP_L_02: "建立现代后勤信息系统"
 PRC_00_MR_BACKUP_L_02_desc: "后勤信息系统建设以全军物资编目系统为基础，强制推行13位标准物资编码，统一陆海空三军40万类物资标识。建成覆盖军区、集团军、师团三级的后勤指挥信息网，联通全军200余个物资储备库和运输枢纽，实现需求提报、库存调拨、在途运输全流程电子化管控。核心突破在于部署动态可视系统：通过电子标签与定位技术，对重点作战物资实施从仓库到战位的实时追踪，战场物资申领周期从72小时压缩至8小时。同时建立后勤数据库，归集油料消耗、装备维修等历史数据，为预算精准核拨提供决策支撑。"
 
 PRC_00_MR_BACKUP_L_03: "医疗体制改革"
 PRC_00_MR_BACKUP_L_03_desc: "医疗体制改革源于解决机构臃肿、资源分散及低效问题，通过整合医疗保障职能、优化资源配置，削减冗余层级以提升战备效率；改革效果显著，实现了医疗资源的集中管理和标准化保障，缩短了伤病员救治周期，降低了运行成本，同时通过引入军民协同机制（如药品集中采购和部分保障社会化），增强了战时医疗支援能力，为整体战斗力生成提供了高效可持续的后勤支撑。"
 
 PRC_00_MR_BACKUP_R_01: "物资采购制度改革"
 PRC_00_MR_BACKUP_R_01_desc: "后勤体系精简化项目聚焦于物资采购制度改革。传统分散采购模式致使机构重叠、资源浪费等问题突出，亟需改革。为此，项目着力构建集中统一采购机制，整合三军采购需求，设立专业化管理机构，并引入市场竞争及电子化平台，实现采购流程规范化与透明化。改革后，采购周期大幅压缩，运行成本显著降低，规模效应显现，经费节省可观，权力寻租行为得到有效遏制。同时，依托军民协同机制，如完善协议供应商制度，战备物资保障效能得到切实提升。"
 
 PRC_00_MR_BACKUP_R_02: "完善装备维修保障体系"
 PRC_00_MR_BACKUP_R_02_desc: "军事物资采购制度改革，其核心是打破传统“买主独一性”的僵化模式，允许防务企业在完成国防订单后将部分非杀伤性装备（如防护服、救灾设备）销往国际市场，以扩大生产规模、摊薄研发成本，解决长期因独家采购导致的“天价装备”问题；同时通过技术授权机制保护国家科研成果，既激活民间企业参与国防工业的积极性，又提升装备采购效益，为应对防卫预算压力并增强国际防务市场竞争力奠定基础。"
 
 PRC_00_MR_BACKUP_R_03: "后勤教育和人才培养改革"
 PRC_00_MR_BACKUP_R_03_desc: "该改革旨在适应现代战争对后勤保障的极高要求，扭转后勤人员单纯保障的定位，推动其向能打仗的战斗员转型。通过强化实战化训练背景下的后勤专业教育（如驾驶员战斗技能训练），并融入科技应用与教学方法革新（如模拟战场、信息化系统），全面提升后勤人员在复杂战场环境下的综合应变能力和战斗素养，确保高效、韧性的作战保障能力。"
 
 PRC_00_MR_MIL_01: "整军备战 保卫祖国"
 PRC_00_MR_MIL_01_desc: "我国军改进程已经进入最终阶段，我们军队的实力将得到进一步的提高，面对帝国主义列强我们也终于有了底气。\n虽然现在的外部环境并没有直接表面我们会面临一场旷日持久的大规模战争，但我们必须时刻做好准备，敌人是不会睡觉的，我们也绝不能松懈。只要军人服役一天，就要随时做好开战的准备。\n面对敌人，中国人民不期待战争，但也不畏惧战争。如果他们胆敢碰一碰我们伟大祖国的铜墙铁壁，人民解放军将与敌人血战到底！定要让他们碰得头破血流！\n§R中国万岁！世界反对帝国主义的人民万岁！§!"
 
 
 
 # PRC 01
 # 第一阶段 FS
 PRC_01_FS_NEWYEAR: "新的一年" #######
 PRC_01_FS_NEWYEAR_desc: "雪落在1997年的最后一天，新一年的钟声即将敲响，在过去的1997年，香港顺利回归，中共十五大成功召开并制定了跨世纪的发展纲领，并且继承伟大的改革开放总设计师邓小平的遗志继续推进中国特色社会主义的建设。北京中南海传来国家主席江泽民的新年贺词。中国人民对中国与世界的未来充满信心。我们愿与各国人民一道，为创造一个和平、稳定、繁荣、进步的新世界而努力奋斗！"
 
 PRC_01_FS_AEE: "防范亚洲金融危机"
 PRC_01_FS_AEE_desc: "亚洲金融危机对1998年中国的影响会是深远的一把“双刃剑”，它既带来严峻挑战和社会阵痛，引发城乡分化加剧以及下岗潮的沉重代价，又倒逼了国家不得不进行关键改革，是否会重塑了中国经济发展路径？但是无论如何这对于中国来讲都是一场不得不打的硬仗。"
 
 PRC_01_FS_IE: "加强金融监管"
 PRC_01_FS_IE_desc: "在亚洲金融危机之中暴露了中国金融监管的漏洞，资本外逃，以虚构进口合同购汇转移资金的情况时有发生。1998年的金融监管强化将会是一场刀刃向内的自救改革，这将会是一场外科手术式的整顿，切除毒瘤，以资本管制铁腕锁死出血点。"
 
 PRC_01_FS_RMB: "坚持人民币不贬值"
 PRC_01_FS_RMB_desc: "中国将坚持人民币不贬值的决策，这一选择关乎了中国国家信誉与国际责任。这一政策不仅将要重塑亚洲经济格局，更会深刻地影响中国自身的金融改革与发展路径。在东南亚经济陷入瘫痪，中国出口骤降，国际舆论纷纷散布“人民币贬值”谣言而借此狙击香港股市。国务院总理朱镕基宣布人民币将不会贬值，希望以短期阵痛换取长期的主权信用。"
 
 PRC_01_FS_IP: "加强宏观调控"
 PRC_01_FS_IP_desc: "大国经济的韧性，不在风平浪静时的顺航，而在惊涛骇浪中锻造出的。面对亚洲金融危机冲击和国内通货紧缩压力，中国政府以政策改革的组合拳实施逆周期调节，以基建投资驱动内需，货币政策从直接管制到间接调控，严格控制资本外流。这是中国式宏观调控范式的确立，危机淬炼中的国家能力升级。这不仅是一场经济救援，更是中国治理现代化的成人礼。"
 
 PRC_01_FS_ANC: "加快国企改革步伐"
 PRC_01_FS_ANC_desc: "面对亚洲金融危机冲击、产能过剩及体制痼疾，中央以“三年脱困”为目标，推出一系列突破性举措。不仅是经济体制的重构，更是一场深刻的社会契约重塑——在阵痛中锻造出中国市场经济的脊梁。而它的代价是下岗职工家庭收入骤降，东北等老工业区出现贫困集聚。"
 
 PRC_01_FS_BTS: "抓大放小"
 PRC_01_FS_BTS_desc: "“抓大放小”旨在通过战略性重组破解国企困境，重塑国有经济布局。这将是一场在转型阵痛中的制度突围，是国企从“计划生存”转向“市场生存”的生死一跃。短期看，它以壮士断腕的魄力淘汰落后产能，为入世竞争锻造微观基础；长期看，其“进与退”的辩证哲学，将会奠定中国特色混合所有制经济的雏形。"
 
 PRC_01_FS_3Y: "三年脱困"
 PRC_01_FS_3Y_desc: "这是中国国有企业改革史上的一场攻坚战役。面对产能过剩及体制痼疾，中央以“壮士断腕”的决心，通过结构性调整与制度重构，实现了国有经济的涅槃重生。“不砸旧饭碗，就端不起新饭碗”。这场改革不仅要重塑了国企筋骨，以其制度韧性为21世纪中国经济崛起埋下伏笔，其平衡“效率与公平”的探索，将会在改革的回响中震荡。"
 
 PRC_01_FS_PZR: "推动战略性重组"
 PRC_01_FS_PZR_desc: "中国推动的战略性重组是国企改革的核心战役，以“壮士断腕”的魄力打破行业壁垒和地域分割，在亚洲金融危机与产能过剩的双重压力下，重塑国有经济格局。这场重组将碎片化的国企锻造成“国家队”，其制度创新与代价付出，成为中国崛起为工业强国的隐秘注脚。"
 
 PRC_01_FS_9TH: "第九届全国人民代表大会"
 PRC_01_FS_9TH_desc: "1998年3月5日，中国第九届全国人民代表大会在北京开幕，这是中国政治生活中的重要阶段，处于世纪之交的关键时期，是中国改革开放和现代化建设的关键时期，在改革深水期承担了承前启后的使命，通过宪法修正与关键立法，构建社会主义市场经济法律框架；  以立法授权化解金融危机、国企沉疴，完善港澳治理法律体系，彰显主权统一决心。其任期恰逢中国融入全球化的关键转折，为21世纪经济崛起与国家治理现代化奠定了制度基石。"


 PRC_01_FS_TYR: "长江告急" #######
 PRC_01_FS_TYR_desc: "长江地带自古以来便多发洪水，但是近几次的水位相继超过警戒水位，并且开始向主要聚落区转移，造成了严重的危害，这一次的洪水是近百年来从未有过的严重洪灾。如果再等他波及到人口繁杂的下游以及长江三角洲地带，那么人民就会对政府进行质疑！我们没有时间耽搁了，必需尽快调动全国之力防洪。现在每一分！每一秒！都十足地珍贵。在浩浩荡荡地出征之前，我们必需准备好防洪的计划以及物资。集全国之力防洪，祖国和人民考研我们党的领导作用的时候到了！我们唯有齐心协力，众志成城。方可抵过一切危难，踏过一切险阻。"
 PRC_01_FS_TYR_a_tt: "此国策由§Y长江告急§!触发"
 
 PRC_01_FS_MC: "中央调令"
 PRC_01_FS_MC_desc: "“中华人民广播电台，华中紧急调频，华东紧急调频！长江中下游地带出现严重的洪灾！请长江中下游地带的人民……”党是在历史和人民的选择中存活下来的，接下来我们必须展现出我们的价值！华夏民族再一次受到了来自于大自然的压迫，但是这一次我们绝不会妥协！我们要集结来自于中华民族的力量，所有中华民族团结起来。用血肉筑起我们新的长江大坝！一次次的妥协绝对不属于中华民族！中央紧急调令，举全国之力向着长江进攻！"
 
 PRC_01_FS_CWY: "与你同行"
 PRC_01_FS_CWY_desc: "“同志们，解放军即将抵达洪灾区域，请各位不要慌张。如有看到解放军的同志们，请互相传达，到指定区域避难”很显然，事到如今我们必须动用武装力量来抵抗这场洪灾。如果再不调动军队，那么人民对解放军的信任感就会消失。并且我们的军队久经考验，这一次是展现我们军队风光的时候！我们要下达“决战决胜”动员令！党和人民考验我们的时候到了！我们必须要保卫好重要城市！我们不怕牺牲，只怕人民对我们失望，上吧同志们，用血肉筑起我们新的长城！"
 
 PRC_01_FS_AIO: "众志成城"
 PRC_01_FS_AIO_desc: "“请长江中下游地带的人民做好防护措施，相邻的同志互相协助，优先保护弱势群体撤退！”长江中下游爆发的特大级洪水已经不是单单依靠某个群体就能解决的了，他的范围已经扩大，即将蔓延至整个中国！想要打赢这场抗洪战，就必须让全国人民都参与到其中。我们必须号召全国人民一起抗洪。这场洪水不仅仅危害长江中下游的人民，更会间接影响到全国人民！让群众支援军队，让人民群众自发组成志愿者，宣传“抗洪精神”展现出人民群众在灾难中的坚韧与团结！"
 
 PRC_01_FS_HU: "人民至上"
 PRC_01_FS_HU_desc: "“古往今来，中华民族同洪水发生了千百次的战争！但是我们不会怕，即便洪水再来一千次一万次！我们照样有“大禹”和“定海神针”！各位同志们千万不要害怕，这一次的战争，全国人民陪你们一起打！”抗洪中无数感人事迹频发，这无疑大大地宣传了我们的“抗洪精神”以及我们全国人民统一的爱国主义精神，这场激烈且壮烈的抗洪战争，证明了一点即：党的根本宗旨是为人民服务！"
 
 PRC_01_FS_RBT: "江从红龙"
 PRC_01_FS_RBT_desc: "当前线传来洪灾停止的消息时，这意味着历经千千万万个日夜，中华民族再一次的挺过来了！这条自中华民族诞生起便存在的河流——长江——再一次地被我们征服了！我们不怕任何天灾人祸！任何灾难在中华民族面前不过历史尘埃罢了…进行完了长篇感慨之后我们本应该进行总结报告。不过在总结报告之前，我们需要反思一个问题：为什么这次洪灾会突然爆发？为什么之前的大坝没有起任何作用？我们已经派往专家人员进行测查，而得出的结果不出我们所料……因此我们现在只有一种选择，即重新建造长江大坝。"



 # PRC 02
 # 第二阶段 SS
 PRC_02_SS_01: "推动多项改革与建设"  #######
 PRC_02_SS_01_desc: "这是中国深化改革的关键一年，多项重大改革措施正集中推进，尤其在政府机构调整、政企分离、经济体制转型等领域将取得突破性进展。以“破旧立新”为核心，通过强力撤并机构打破利益藩篱，为市场经济铺路；以政企分开重构政府角色；配套推进法制与供给侧改革。其意义不仅是机构数量的减少，更是政府运行逻辑从计划管控向服务监管的历史性转型，深刻塑造了后续20年的治理体系框架。"

 PRC_02_SS_IT_01: "互联网新兴" #######
 PRC_02_SS_IT_01_desc: "在民用互联网刚开始的那几年，中国正忙于改革，没有精力去建设这如同娇贵婴儿的新兴产业——更何况其实当时的中国并没有多少人去关注这种未知的产业，毕竟没人愿意做这种吃力不讨好的事情。但最近几年中国看到了互联网的优越性，国内的互联网发展迅速。"

 PRC_02_SS_IT_L_01: "金盾工程"
 PRC_02_SS_IT_L_01_desc: "互联网兴起后也为各类行业提供改革的机会，为让公安部门提升执法的速度与质量，国务院通过了以“增强统一指挥、快速反应、协调作战、打击犯罪的能力”为目的的金盾工程的审批，为共和国的人民安保做出巨大贡献。"

 PRC_02_SS_IT_C_01: "创业元年"
 PRC_02_SS_IT_C_01_desc: "在千禧元年这个极具历史性的年份，中国的互联网产业蓬勃发展，网民数量呈爆炸式的增长。不仅如此，在这一年各类互联网的各色公司也开始崭露头角，腾讯、网易亦或者是其他功能的各色网络新兴企业也正如病毒版的疯狂成长，因此这一年也被叫做“创业元年”。"

 PRC_02_SS_IT_R_01: "键政萌芽"
 PRC_02_SS_IT_R_01_desc: "键盘政治，是在互联网兴起后的一种全新现象。简单来说就是在互联网上畅聊政治，这样就不可避免的会涉及到现在敏感的事件。虽然这样对我们没有什么太大的影响，但闲话终究是不好听的，我们仍旧在观望看是否要出手干涉。"

 PRC_02_SS_IT_L_02: "建设大型机房"
 PRC_02_SS_IT_L_02_desc: "在国家着手建设网络后，中央下达指令要求完善网络基础建设，以求为未来的网络建设做准备。并且以“探求新产业，谋求新发展”为理念，以改革开放的探索精神与奋斗精神为内核开启了新的互联网建设，开启了大型机房的建设。"

 PRC_02_SS_IT_L_03: "国家基础信息库"
 PRC_02_SS_IT_L_03_desc: "在全国各地建设完“网络基建”后，国家通过了建设“国家基础信息库”的决议（下文称信息库）。据国家的预想，信息库的出现不仅能完善我国基层的各色事件、能强化国家公安部门的建设，完善共和国的警察建设，还能加快我国政务建设，推动政府法治建设。"

 PRC_02_SS_IT_C_03: "拆分中国电信"
 PRC_02_SS_IT_C_03_desc: "在国家改革中，国务院批准“中国电信南北拆分决议”，将北方九省一市以及河南、山东划为中国网通集团管辖，其余地区则依旧保持由电信集团运营。此举意图让中国电信引入市场竞争，实现局域竞争，打破垄断。"

 PRC_02_SS_IT_C_02: "完善网安法"
 PRC_02_SS_IT_C_02_desc: "网络是个比现实更加自由的地方，几乎人人都可以发表意见与看法，上传自己喜欢的东西。但是从实际来看，网络的风气会因为自由而变得日渐堕落，而且还会有人因为网络而上当受骗。网络不是法外之地，我们应该完善网络安全法来在网络上规范网络，保护人民。"

 PRC_02_SS_IT_C_02_L: "“防火长城”"
 PRC_02_SS_IT_C_02_L_desc: "§R Great FireWall§!，即中国防火墙亦称中国国家防火墙，一般情况下防火长城主要指中国对互联网内容进行自动审查和过滤监控、由计算机路由器等网络设备所构成的软硬件系统。此举旨在保护中国网络纯洁性，维护国家安全稳定。"

 PRC_02_SS_IT_C_02_R: "“江水滔天”"
 PRC_02_SS_IT_C_02_R_desc: "互联网可以让全世界的消息如同河流一样汇聚到海里，全世界的消息都能在互联网大海中被了解。我们中国的互联网防火墙应该保障人民了解世界的同时稳固他们的安全，塑造一个互联网通行的中国电子运河。"

 PRC_02_SS_IT_R_02: "铺设国家主干光缆网"
 PRC_02_SS_IT_R_02_desc: "为降低互联网的成本，让更多民营企业和普通人民群众用上互联网。显然的，光缆的优越性能和作用完美符合预期。在中央敲定主意后，由国家建设部等行政部门多方面负责的国家级别光缆建设工程正式开始。这代表了中国互联网产业正在以难以置信的速度发展。"

 PRC_02_SS_IT_R_03: "普及宽带上网"
 PRC_02_SS_IT_R_03_desc: "为提升网络速度，加强互联网的经济效益、满足人民对网络娱乐的需要，由于宽带高于普通WiFi的稳定性、较低的延迟利于网络建设。在“国家基础建设与经济发展大会”上决定用“宽带上网”的方式建设互联网。"

 PRC_02_SS_IT_02: "国家信息化发展战略"
 PRC_02_SS_IT_02_desc: "中国信息化发展战略概括为：以信息化促进工业化，以工业化带动信息化，走出中国特色的信息化道路。重点在于推进国民经济信息化：推进面向“三农”的信息服务、利用信息技术改造和提升传统产业、推行电子政务等新型战略发展。"

 PRC_02_SS_GR_01: "政府改革" #######
 PRC_02_SS_GR_01_desc: "98年国务院机构改革将会是中国行政体制改革史上的里程碑事件，其旨在破解计划经济遗留的机构臃肿、政企不分、效率低下等顽疾，构建适应社会主义市场经济的新型政府架构。破旧立新的关键一跃是中国告别计划经济管理模式的宣言书，是邓小平理论在中国即将迈进二十一世纪的实践，以雷霆手段裁撤15个部委，斩断政企不分的体制脐带，“政府瘦身非为减负，而为强筋健骨；放权非为卸责，而为激活万马奔腾。”"

 PRC_02_SS_GR_L_01: "合并机构"
 PRC_02_SS_GR_L_01_desc: "这会是改革开放以来力度最大的一次组织结构调整，核心目标是实现“政企分开”和适应社会主义市场经济体制。改革通过大规模撤并计划经济色彩浓厚的专业经济管理部门，重组职能交叉机构，精简人员编制，推动政府职能转向宏观调控、市场监管和公共服务。"

 PRC_02_SS_GR_L_02: "强化宏观管理机构"
 PRC_02_SS_GR_L_02_desc: "中国国务院机构改革的核心目标之一即是强化宏观调控能力，通过重构经济管理机构，推动政府职能从微观干预转向宏观统筹。此次改革将原有计划经济色彩浓厚的专业经济管理部门大幅精简，同时系统性强化了四大宏观调控部门的职能，此次改革不仅是部门精简，更是中国经济治理逻辑的深刻转型，为后续20年高质量发展奠定基石。"

 PRC_02_SS_GR_L_03: "组建新部门"
 PRC_02_SS_GR_L_03_desc: "1998年3月10日，第九届全国人民代表大会第一次会议批准了《国务院机构改革方案》，此次改革以“政企分开、职能优化”为核心目标，通过大规模撤并专业经济管理部门并整合职能，新组建了4个部委，彻底重构了国务院的组织架构。新部门的组建不仅是机构数量的调整，更是政府角色从“直接干预”转向“宏观调控与公共服务”的标志性转折：通过整合碎片化职能，构建了适应市场经济的基础框架，尤其以统一社保体系、资源集中管理、信息产业统筹为突出成果。"

 PRC_02_SS_GR_C_01: "削减部门"
 PRC_02_SS_GR_C_01_desc: "这是改革开放以来力度最大的“政府精简行动”，核心目标是解决计划经济遗留的机构臃肿、政企不分问题。此次改革通过大规模撤销专业经济管理部门、重组职能机构，实现了历史性突破。1998年削减政府部门是一场“断腕式”的制度革命，摧毁了计划经济管理的组织根基，推动政府角色从“运动员+裁判员”转向“规则制定者+市场监管者”，机构精简需与职能转变、法治建设同步推进，否则可能陷入“精简—膨胀”循环。1998年改革的价值，正在于以雷霆手段实现了这一系统性突破。"

 PRC_02_SS_GR_C_02: "打破“条块分割”"
 PRC_02_SS_GR_C_02_desc: "打破“条块分割”的行政壁垒，这一顽疾长期阻碍统一市场形成与资源优化配置。改革通过系统性重构机构职能与权力结构，实现了从“分割管理”向“统筹治理”的转型。通过撤销工业部委、垂直管理资源与金融，削弱“条块”博弈的制度基础。以“大部门制”雏形整合交叉职能，提升跨领域协同能力，此次改革将解决了计划经济遗留的组织难题，以及奠定“中央统筹—专业监管—市场自主”的现代治理框架。"

 PRC_02_SS_GR_C_03: "政府职能转变"
 PRC_02_SS_GR_C_03_desc: "1997年党的十五大指出“机构庞大、政企不分阻碍经济发展”，要求建立适应社会主义市场经济的行政管理体制。因亚洲金融危机爆发，亟需政府从微观干预转向宏观调控，提升经济抗风险能力。改革撤销专业经济部门，终结政企不分，工业专业经济部门的撤销，消除了计划经济的组织基础，国企逐步成为市场主体。"

 PRC_02_SS_GR_R_01: "精简司局"
 PRC_02_SS_GR_R_01_desc: "司局级内设机构的精简是深化政府职能转变的关键环节，通过系统性裁撤、合并和职能重构，彻底瓦解了计划经济时代“按行业设司”的管理模式。此次改革不仅将压缩了机构数量，更将重构政府运行逻辑——从“管细、管死”转向“抓战略、重监管”。其关键在于 “职能重构先行，编制精简殿后”，为市场经济扫清了最后的微观体制障碍。"

 PRC_02_SS_GR_R_02: "调整职能定位"
 PRC_02_SS_GR_R_02_desc: "从计划经济时代的“全能干预者”转向市场经济所需的“规则制定者”、“服务者”。这一转变通过机构撤并、权力重构和制度创新实现。职能转变不仅依赖机构精简，更需权力约束机制、市场替代能力、央地协同改革三轨并进。1998年改革的深层价值，正在于开启了这场系统重构的长征。"

 PRC_02_SS_GR_R_03: "减少副职与职能重叠岗位"
 PRC_02_SS_GR_R_03_desc: "减少副职岗位与消除职能重叠是提升行政效能的关键举措，通过刚性压缩领导职数、重构岗位职责，从根源上破解了“多头管理”和“人浮于事”的体制顽疾。这是一场打破“官本位”的破冰之战，本质是 “向体制惯性开刀”。"

 PRC_02_SS_GR_02: "精简的机构 高效的行政"
 PRC_02_SS_GR_02_desc: "高效行政从来不是“人海战术”，而是职能精准、权责清晰、工具现代的系统工程。我们以壮士断腕的勇气证明了这一真理，也为新时代“放管服”改革留下宝贵遗产，精简是起点，高效是终点，而人民的获得感才是终极标尺。此次改革通过系统性精简机构与重构职能，实现了行政效能的跨越式提升，其核心逻辑是“减量提质”，以机构撤并推动流程再造，以编制压缩倒逼效率革命。"

 PRC_02_SS_GR_03: "服务型政府"
 PRC_02_SS_GR_03_desc: "以机构精简推动职能转变，以职能转变重塑公共服务供给模式。通过系统性重构政府职能，实质上迈出了从“管制型”向“服务型”转型的关键一步，构建服务型政府蓝图。以服务型政府为躯体，为人民服务的宗旨为灵魂，此次改革将为未来中国改革奠定基础。正如朱镕基所言：“改革要触动利益，但人民的利益永远是最高利益。”"

 PRC_02_SS_GR_ED_01: "推动教育改革"
 PRC_02_SS_GR_ED_01_desc: "教育是一个国家、一个民族进步的基石，但是我们国家现在的教育方式和教育理念是十分落后的，我们这种需要的是能够选拔出人才的新教育，在中央下令教育改革后，我们必须要保证教育改革的顺利推进。"

 PRC_02_SS_GR_ED_02_L: "旧高校合并重组"
 PRC_02_SS_GR_ED_02_L_desc: "在现在，一些高校已经落后于世界发展，有些高校的资金链已经破裂……这些问题导致了教育的问题，我们要将一些冗杂的学校合并起来，再给予资金、给些政策，让这些推动教育改革的主力军重新焕发生机。"

 PRC_02_SS_GR_ED_02_R: "扩建新式高校"
 PRC_02_SS_GR_ED_02_R_desc: "中央号召“两步走”战略。即合并旧优质学院、创立新高端院校一手抓，以学校为单位试行教育新政。我们必须在各个不同的地区扩建制度新、理念新、教育资源强的新型综合性高校。力求高校自管、高校自立、自强。"

 PRC_02_SS_GR_ED_03: "扩大招生规模"
 PRC_02_SS_GR_ED_03_desc: "对于大众来说，学校严格的招生制度与招生限制卡着教育改革的前进，这样不符合我们改革教育的初衷，反而增大了改革的压力，我们需要必要的扩招政策，将招生限制在不破坏学校质量的前提下稍微放宽，让更多人上的了学，让“早上八九点钟的太阳”接受更多的教育。"

 PRC_02_SS_GR_ED_04_L: "多元化教学"
 PRC_02_SS_GR_ED_04_L_desc: "“非学无以广才，非志无以成学。”在社会主义时代，教育大为进步，但教育的目的一直不变：提升个人修养与能力、塑造人的品格。因此，我们的教育是要能培养“人”与“才”的教育，而不是获得利益的手段与工具。所以我们的教育得多元与深刻。"

 PRC_02_SS_GR_ED_05_L: "“好好学习，天天向上”"
 PRC_02_SS_GR_ED_05_L_desc: "在教育改革时期，学生们可能会迷茫、不安——因为变革来的实在太快，不知道自己学习的目的，我们要设计一个简单易懂的标语，让同学们真正理解学习的目的：自强向上，让同学们燃起对学习的热情与兴趣。"

 PRC_02_SS_GR_ED_04_R: "提高校园餐饮要求"
 PRC_02_SS_GR_ED_04_R_desc: "一个学生，在学好之前首先要吃得好、睡得好、穿得暖。但我们发现，有些学校为了所谓的“节流”故意克扣学生的餐饮经费，这对于学生来说是难以想象的。为了学生吃的饭菜干净、卫生且有营养，我们必须用更加严苛的方式确保学校餐饮的安全。"

 PRC_02_SS_GR_ED_05_R: "“投身实践，为国献力”"
 PRC_02_SS_GR_ED_05_R_desc: "“实践是检验真理的唯一标准”为了学生们的健康成长，我们必须让他们投身于实践，让他们自主的看待事物，培养他们的政治意识。并且在社会主义时代的中国需要各方各面的中国人去努力拼搏，艰苦卓绝的奋斗才能建设好中国。"

 PRC_02_SS_GR_ED_06: "科教兴国"
 PRC_02_SS_GR_ED_06_desc: "教育改革让所有人意识到，只有科教才能兴国，只有教育才能强国。我们必须毫不动摇的坚持教育改革，让中国教育一直屹立于世界之巅，让教育能选择出不同方面的人才，所以我们必须坚持科教兴国战略，树立永不改变的改革精神。"

 PRC_02_SS_GR_BC_01: "建设美丽中国"
 PRC_02_SS_GR_BC_01_desc: "如果有人第一次听到“建设美丽中国”的口号，恐怕只会将其视作又一纸泛泛的政治标语——那些写在横幅上、挂在会议墙角的空洞词句，像无数口号一样，注定被风吹散在尘世喧嚣中。但这是极大的误解：这项国策并不追求一时的掌声与虚荣，它关心的不是谁站上讲台、谁获得奖章，而是如何让各民族之间真正实现和谐共处，让东西南北的孩子们都能在公平中成长。它以沉默的方式深入每一座村庄与城市，用建设的方式回应人民的期待。批评者称它理想主义，“太慢、太繁复、太难”。但我们从不为此动摇，并始终坚信，唯有全国的新建设，才能真正打下未来的基石，无论代价多大。"

 PRC_02_SS_GR_BC_02_L: "到西部去"
 PRC_02_SS_GR_BC_02_L_desc: "自古代以来，我国东西地区的发展差距巨大。现在我们要建设一个富足美丽的中国，我们就不能落下任何一个地区。纵使千山万水，也拦不住我们建设西部的决心！"

 PRC_02_SS_GR_BC_03_L: "协发展，共繁荣"
 PRC_02_SS_GR_BC_03_L_desc: "党的十六届三中全会上提出“要按照统筹城乡发展、统筹区域发展、统筹经济社会发展、统筹人与自然和谐发展、统筹国内发展和对外开放的要求，更大程度地发挥市场在资源配置中的基础性作用，为全面建设小康社会提供强有力的体制保障。”，这无不彰显出新提出的“区域协调发展战略”的重要地位。共同富裕是我们现时代的主要目标之一，如果只看重东部地区的富庶不管西部边疆的荒凉，我们必然脱离党的宗旨，最终将会变为下一个苏联。"

 PRC_02_SS_GR_BC_05_L: "社会主义民族关系"
 PRC_02_SS_GR_BC_05_L_desc: "在伟大的社会主义中，全社会团结一致、友爱互助、共同奋斗、共同前进，大力发展少数民族经济，缩短各民族之间的差距，实现共同富裕。"

 PRC_02_SS_GR_BC_06_L: "“西部大开发”战略"
 PRC_02_SS_GR_BC_06_L_desc: "东部沿海地区的经济发展相当出色，如果把东部沿海地区的剩余经济发展能力，用以提高西部地区的经济和社会发展水平、巩固国防，西部地区大量的矿产、土地等资源都将得到充分的利用。"

 PRC_02_SS_GR_BC_02_R: "在南方见"
 PRC_02_SS_GR_BC_02_R_desc: "南方的开发至今已有一千余年，这次特大洪水让中央不得不重视起南方地区的生态改造，无论是受灾区的重建还是洞庭湖地区的发展，我们都将全力以赴，团结一致，为建设美丽中国奋斗。"

 PRC_02_SS_GR_BC_03_C: "退耕还林"
 PRC_02_SS_GR_BC_03_C_desc: "南方地区原本有者大量的树木，但持续不注重环境的发展让当地的生态环境遭到重创，我们不得不向大自然做出让步，将一部分过度开发的耕地变回树林，以退为进，助力当地的可持续发展。"

 PRC_02_SS_GR_BC_04_C: "植树造林"
 PRC_02_SS_GR_BC_04_C_desc: "长期以来，我国的西北地区风沙危害和水土流失十分严重，木料、燃料、肥料、饲料俱缺，农业生产低而不稳，建设防护林显然是最有效的方案，在西北地区建设大量的防护林，不仅可以预防各种自然灾害，也显示了我们建设西部的决心。"

 PRC_02_SS_GR_BC_06_C: "贯彻中国21世纪议程"
 PRC_02_SS_GR_BC_06_C_desc: "我们驯服了咆哮的江水，涤荡了污浊的天空与大地。在与自然的搏斗中，人民的意志经受住了最严峻的考验。现在，是时候将这些用血泪换来的经验，升华为指引国家未来的长远方略了。虽然联合国的威严不复存在，但那份名为《21世纪议程》的纲领性文件依然有其价值。其描绘的可持续愿景，如今将成为我们自己的誓言。这份议程将成为我们未来数十年环境治理的基石，确保那样的滔天巨浪，永远只存在于人们的记忆之中。"

 PRC_02_SS_GR_BC_03_R: "洪水之痕"
 PRC_02_SS_GR_BC_03_R_desc: "面对洪水，中国共产党领导人民面对困难，帮助人民客服困难。江泽民同志亲赴湖北长江抗洪抢险第一线，看望、慰问、鼓励奋战在抗洪抢险第一线的广大军民，指导抗洪抢险斗争。但是，此次大洪水说是百年一遇都不为过，它给人民群众带来了巨大的破坏，这需要我们花费较长的时间去重建受灾区。"

 PRC_02_SS_GR_BC_L_04: "重建住房和公路"
 PRC_02_SS_GR_BC_L_04_desc: "洪水冲垮了住房，漫过了公路，但是冲不走我们战胜洪水并重建家园的决心，现在的首要目标是恢复当地交通、重建当地的房屋。"

 PRC_02_SS_GR_BC_L_05: "恢复当地社会稳定"
 PRC_02_SS_GR_BC_L_05_desc: "在这场伟大的抗洪抢险斗争中，我们形成了万众一心、众志成城，不怕困难、顽强拼搏，坚韧不拔、敢于胜利的伟大抗洪精神，这是无比珍贵的精神财富。现在洪水已经退去，但受灾区的社会稳定与日常生产并未完全恢复，我们要以最大的努力，帮助当地尽快恢复灾前的日常生产并维持当地的社会稳定。"

 PRC_02_SS_GR_BC_R_04: "改造泄洪区"
 PRC_02_SS_GR_BC_R_04_desc: "泄洪区为这次暴雨做出了巨大的贡献，当地也因此成为了最难重建的地区，我们要对泄洪区进行全方面的改造，争取下次暴雨来临的时候能最大限度地减少洪水对受灾区的破坏。"

 PRC_02_SS_GR_BC_R_05: "发展滞洪区经济"
 PRC_02_SS_GR_BC_R_05_desc: "滞洪区在灾前也有过良好的经济，但其洪灾的到来使其不得不为救灾而暂且放弃当地大好的经济走势，滞洪区在洪灾中的工作已基本完成，现在的首要任务就是恢复当地的经济。"

 PRC_02_SS_GR_BC_06_R: "加快三峡水利枢纽工程"
 PRC_02_SS_GR_BC_06_R_desc: "三峡水电站，即长江三峡水利枢纽工程，又称三峡工程。中国湖北省宜昌市境内的长江西陵峡段与下游的葛洲坝水电站构成梯级电站。三峡水电站是世界上规模最大的水电站，也是中国有史以来建设最大型的工程项目。三峡工程主要有三大效益，即防洪、发电和航运。这次大洪水让我们意识到水利枢纽的重要性，三峡工程必须尽快投入使用，让下一次洪水来临时我们有充足的时间和空间进行防范。"

 PRC_02_SS_GR_LS_01: "完善法律体系"
 PRC_02_SS_GR_LS_01_desc: "“立善法于天下，则天下治；立善法于一国，则一国治。”我们要形成以宪法为主要核心的中国特色法治体系，让法律协调各部门之间的发展，做到有法必依，执法必严，违法必究。"

 PRC_02_SS_GR_LS_03_A: "科学立法"
 PRC_02_SS_GR_LS_03_A_desc: "科学立法是指立法过程中必须以符合法律所调整事态的客观规律作为价值判断，并使法律规范严格地与其规制的事项保持最大限度地和谐，法律的制定过程尽可能满足法律赖以存在的内外在条件。科学立法‌作为全面依法治国的首要环节，其核心在于通过尊重社会发展规律和立法技术规范，制定符合客观实际的法律体系。根据《中共中央关于全面推进依法治国若干重大问题的决定》，科学立法与严格执法、公正司法、全民守法并列构成法治中国建设的四大支柱，直接决定了法律规范体系的系统性、针对性和可操作性。‌‌"

 PRC_02_SS_GR_LS_03_B: "严格执法"
 PRC_02_SS_GR_LS_03_B_desc: "‌严格执法的核心意义‌在于捍卫法律权威、实现社会公平正义、推进法治政府建设，为法治中国建设提供根本保障。‌执法机关做到严格执法，能够维护法律权威与尊严，促进社会公平正义，推动法治政府建设。\n\n什么？大义灭亲？这是为人民铲除社会主义事业的绊脚石！"

 PRC_02_SS_GR_LS_03_C: "公正司法"
 PRC_02_SS_GR_LS_03_C_desc: "司法公正它是法律的自身要求，也是依法治国的要求，其基本内涵是要在司法活动的过程和结果中体现公平、平等、正当、正义的精神。审判机关的工作不应该受到任何外部因素的干扰，不管是亲人还是朋友，所有人在法律面前一视同仁，没有人有可以逃过司法的。"

 PRC_02_SS_GR_LS_03_D: "全民守法"
 PRC_02_SS_GR_LS_03_D_desc: "人民群众在民主、法治、公平、正义、安全等方面的要求日益增长，更需要尽快形成人人尊崇法律的氛围，法治社会的建设离不开人民，中国法治体系的建设更需要人民。"

 PRC_02_SS_GR_LS_05_L: "依法治国"
 PRC_02_SS_GR_LS_05_L_desc: "现代中国是法治社会而非法制社会，一切事情都要以法律为衡量标准，用法律来治理国家是依法治国的核心，法律将不再是统治阶级的工具而是所有人共同的行为底线。"

 PRC_02_SS_GR_LS_05_R: "厉行法治"
 PRC_02_SS_GR_LS_05_R_desc: "“厉行法治”注重制度执行，不讲情面。它不依赖口号宣传，而通过完善法律制度和严格执法逐步推进法治建设。法律适用于所有人，无论是官员还是普通公民，都必须遵守。制度覆盖社会各个层面，确保没有法律盲区。在全面依法治国的进程中，任何人都不能逃避法律的约束和责任。"

 PRC_02_SS_GR_LS_06: "中国特色社会主义法治体系"
 PRC_02_SS_GR_LS_06_desc: "中国特色社会主义法治体系是全面推进依法治国的总目标。建设社会主义法治国家。我们要在全方位实现法律的公平公正，全面推进依法治国涉及很多方面，在实际工作中必须有一个总揽全局、牵引各方的总抓手，这个总抓手就是建设中国特色社会主义法治体系。"

 PRC_02_SS_MC_01: "医疗改革" #######
 PRC_02_SS_MC_01_desc: "公费医疗和劳保医疗制度因企业负担过重、覆盖面窄、浪费严重等问题难以为继。医药费用暴涨，“以药养医”导致滥开贵药、以物代药等乱象频繁出现。中国力求建设适合社会主义市场经济的医疗模式，改革核心目标是建立覆盖城镇职工的现代医疗保障体系，同时推动医药卫生体制的结构性调整。"

 PRC_02_SS_MC_L_01: "医疗专精化"
 PRC_02_SS_MC_L_01_desc: "中国医疗体系的“专精化”转型，是配合城镇职工医保制度改革和医院管理优化的重要实践，其核心在于通过学科重组、技术升级、管理创新提升医疗服务的专业化与精准化水平。创新学科协作模式将解决“大而全”导致的资源浪费，专科效率显著提升。国产CT等装备突破降低了专精化技术下沉门槛，助推分级诊疗雏形形成。"

 PRC_02_SS_MC_C_01: "集团化发展"
 PRC_02_SS_MC_C_01_desc: "医改的核心是配合国有企业改革，解决计划经济时代公费医疗和劳保医疗在改开后崩溃的保障缺失问题。原有制度因财政压力和组织基础瓦解，国企破产、农村公社解体，导致近半数居民无医保，自付医疗费用激增。这将会是中国医疗从“国家包办”转向“市场机制”的转折，它将通过集团化探索为医疗供给释放潜力，或许也将埋下公平性与商业化的长期矛盾。这究竟是打造营利性医疗托拉斯，还是重建公益导向的卫生网络？"

 PRC_02_SS_MC_R_01: "医院规模化"
 PRC_02_SS_MC_R_01_desc: "政府推行“放权让利”，允许医院自筹资金扩建，催生医院通过贷款、合资等方式扩张床位、更新设备。医保按病种付费政策促使医院多收轻症患者摊薄成本，进一步刺激床位增加。城镇职工医保改革释放就医需求，门诊量与住院量激增。这是政策激励、需求释放与生存压力共同作用的产物，其展现的双面性将会深刻塑造中国未来的医疗格局，快速提升服务供给能力，又因无序扩张加剧系统失衡。"

 PRC_02_SS_MC_L_02: "改变“以药养医”机制"
 PRC_02_SS_MC_L_02_desc: "中国的财政拨款仅够支付医生基本工资，而仪器要更新、病房楼要扩建，全得靠15%的药品加成。药房变成了印钞机，白衣天使在处方笺上跳起危险的芭蕾。抗生素用量是世卫标准的3倍，心血管支架植入率年年暴涨，某县医院甚至给感冒患者开出抗癌药。这是一场手术刀与金钱的战争，中国医疗体系改革将割除“以药养医”的肿瘤。它的血管早已长进医疗体系的脏器深处。在计划经济时代种下的畸形种子，在改开后市场化浪潮中疯长成参天大树。"

 PRC_02_SS_MC_L_03: "推进诊所运营标准化"
 PRC_02_SS_MC_L_03_desc: "诊所运营标准化的核心是以监管替代放任，破局旧制，废止1988年宽松的开业办法，通过地方法规建立准入、操作、监管的全流程标准，标准化不仅是技术规范，更是重塑基层医疗公信力的制度杠杆。从“赤脚医生”的经验主义，迈向现代诊所的系统治理。"

 PRC_02_SS_MC_C_03: "推进医保支付改革"
 PRC_02_SS_MC_C_03_desc: "通过统筹基金破解单位保障碎片化困境， 制定起付线、竞争性定点机构抑制过度医疗， 这是个人账户设计体现改革妥协，为后续优化预留空间。  建立“保基本、强约束、促竞争”框架，既是回应国企改革配套的急迫需求，也为中国医保从“广覆盖”走向“精细化”支付改革铺设了制度轨道。后续深化将平衡效率与公平、个人责任与社会共济的矛盾，尤其是个人账户转型与基层服务能力短板的破解。"

 PRC_02_SS_MC_C_02: "中西医结合发展"
 PRC_02_SS_MC_C_02_desc: "这将是中国医疗“两条腿走路”的战略转折点。它既通过政策赋能使中西医结合脱离边缘地位，又以临床实效验证了中国方案的全球价值。其构建的“医教研产”协同生态，为后续二十余年中医药复兴奠定了不可逆转的制度基础。在传统与现代的碰撞中，一条属于中国的独特医疗道路已然成型。终结了“西学中”短期培训的碎片化模式，成为中国特色医疗卫生道路的支柱之一。"

 PRC_02_SS_MC_C_02_L: "发展非公医疗"
 PRC_02_SS_MC_C_02_L_desc: "面对国企改革遗留的医疗废墟与医保基金缺口，中国作出石破天惊的抉择，向资本全面开放医疗高墙。这究竟是让市场之手缔造医疗效率奇迹，还是目睹生命权在股市曲线中崩解?当手术刀遇见资本，一场拯救与掠夺的赛跑开始了。医院不是慈善场，能者生存，让民营做鲶鱼，但牢握缰绳！"

 PRC_02_SS_MC_C_02_R: "强化公共医疗"
 PRC_02_SS_MC_C_02_R_desc: "中国通过社会化风险分担和破除逐利机制重塑医疗公益性，尽管公平性与监管体系尚不完善，但其制度框架将成为21世纪中国医疗公共化的基石。阶段改革标志着中国医疗从“国家包办”转向“社会共济”，其建立的医保框架、医药分治原则及服务竞争机制，为后续医改提供了不可逆的制度路径。"

 PRC_02_SS_MC_R_02: "建立城镇职工医疗保险"
 PRC_02_SS_MC_R_02_desc: "这是下岗职工基本医疗保障的“安全网”，缓解了其因病致贫的风险，能够一定程度上减轻社会转型期的矛盾。同时，社会化的医保体系也为国企改革的顺利推进创造了条件，减少了职工医疗保障问题对改革的阻力，是配合经济结构调整、维护社会稳定的重要配套措施。原有的单位医疗保障模式难以适应这一变化，下岗职工脱离原单位后，医疗保障失去依托，成为亟待解决的民生问题。建立城镇职工医疗保险制度，正是为了打破“单位保障”的局限，将包括下岗职工在内的城镇职工纳入社会化保障体系，为这一群体提供稳定的医疗支持。"

 PRC_02_SS_MC_R_03: "加强基层医疗体系建设"
 PRC_02_SS_MC_R_03_desc: "这是现代医疗体系的基石，这一年奠定了中国医疗“保基本、强监管、促竞争”的底层逻辑，其改革以城镇职工医保制度建立和医药分家试点为核心，构建了现代医疗体系的基础框架。其成就与局限将共同塑造后续医改路径，均根植于此制度框架。"

 PRC_02_SS_MC_02: "“全心全意为人民健康服务！”"
 PRC_02_SS_MC_02_desc: "“全心全意为人民健康服务”是中国医疗卫生事业的根本宗旨。“人民健康”不是静态口号，而是动态制度实践。1998年医改在财政约束与转型阵痛中，以社会化医保破除单位福利壁垒，以医药分家捍卫医疗公益性，用以诊所标准化重建基层公信力。无论其成就与局限都共同证明：只有当制度设计始终锚定“人的健康权”，医疗改革才能真正成为文明进步的刻度尺这既将成为历史的回响，也将是未来医改的永恒坐标！"
 
 
 
 # PRC 03
 # 第三阶段 TS
 PRC_03_TS_FL_01: "战火又燃" #######
 PRC_03_TS_FL_01_desc: "半岛上烽火再起，朝鲜与韩国之间的摩擦愈演愈烈。仅仅几十年过去，朝鲜半岛上又要爆发新一轮的战争！对战争的渴望冲昏了双方的头脑，使他们无法接受和平渡过此次危机的手段！作为美国的走狗，韩国再一次向北约寻求帮助，试图借此机会统一朝鲜半岛。作为朝鲜的邻国，韩国如果在此次战争中胜利，唇亡齿寒，我们也会在北约新一轮的打击下走向末路。北约的势力就会侵吞整个东亚，亚洲势力就会迎来大洗牌。为了祖国和人民，我们必须派出军队支援朝鲜。"

 PRC_03_TS_FL_02: "支援邻邦，反对侵略"
 PRC_03_TS_FL_02_desc: "朝鲜半岛的战争已经正式爆发，美国开始动员，北约的军队蓄势待发，韩国统一朝鲜半岛的野心愈演愈烈。我们绝对不能坐以待毙，否则美国以及北约就会不费吹灰之力地拿下朝鲜，在东亚建立名为“自由”的势力，我们也会逐渐被美国吞噬，亚洲离彻底沦为美国的“殖民”地区也不远了。因此这一次的朝鲜战争我们还是要打，并且要使劲打！让美国往后一百年也不敢窥视东亚地区。让社会主义得以继续发光发热。"

 PRC_03_TS_FL_L_03: "全国初步动员"
 PRC_03_TS_FL_L_03_desc: "面对如今的国际形势，以往的动员法案已经不再适应了。所谓“民主与自由”的势力再一次将手伸向了东亚地带。并且在我们的推算中，这一次的侵略早就有所准备了，我们过去几十年内却陷入了各种风波。虽然在前几年的改革当中中国再一次富强起来。但是美帝国主义来势汹汹，我们需要再进一步进行动员。得以让全国人民都参加到这一场反侵略战争中。为了祖国，爆发于我们这一代的战争就由我们这一代来终结吧！"

 PRC_03_TS_FL_L_04_L: "兵役动员"
 PRC_03_TS_FL_L_04_L_desc: "“兵者，国之大事”这一场的战争中我们需要进行全面动员，而动员首当其次的便是兵役动员了。虽说我国正式兵的数量远超大部分国家，但是美国为首的帝国主义国家勾结起来，如同几十年前那般，试图在数量上碾压我们。因此我们必须进行个大规模兵役动员，让那些帝国主义的野心埋葬于朝鲜半岛。"

 PRC_03_TS_FL_L_04_R: "扩招预备役"
 PRC_03_TS_FL_L_04_R_desc: "我国的人口数量在世界上名列前茅，正式兵数量也远超很多国家，但是美帝国主义不打算跟我们单打独斗，到处拉帮结派。很显然，想要打倒美帝国主义这样的怪物我们现存的兵力显然是远远不够的。我们必须将征兵的要求放低一点，让更多有志之士加入我们抗战的队伍当中。在属于东亚巴尔干——朝鲜半岛这个地区发光发热，体现他们的价值所在。"

 PRC_03_TS_FL_L_05: "加强军队演习"
 PRC_03_TS_FL_L_05_desc: "经过好几轮的征兵之后，我国现存兵力足够与北约进行抗衡了。但是由于时间仓促，我们招到的士兵基本都是些“草莓兵”。没有经过训练的士兵跟神风特攻队无疑，一上战场便是必死的存在。这种招式只能在局势完全不利于我们的时候方可一试。在局势彻底坍塌之前必须进行一系列的训练以及演戏，让他们能够轻松地应对接下来在战场上突发的种种情况。"

 PRC_03_TS_FL_L_06: "确立邻国中立性"
 PRC_03_TS_FL_L_06_desc: "美帝的锋芒如黑云压境般侵入东亚，朝鲜战场终究不是往日的义战。大部分国家多是冷眼旁观，生怕踏入这片泥沼。此刻最要紧的，是箍紧邻邦的中立性——尤其南亚与中南半岛，一寸边境线都不能松动。纵使我们同他们有过摩擦，可如果让他们真正的踏入这场战火之中，对他们无异于吞下裹蜜的砒霜。但即便如此，我们仍要预防美国对他们利诱。如果他们从南疆扑咬过来，我们便要在两条战线上淌血。因此，在跨过鸭绿江之前，我们必须要确保邻国的中立性。"

 PRC_03_TS_FL_L_07: "加强边境布防"
 PRC_03_TS_FL_L_07_desc: "虽说很多邻国都已明确在朝鲜战争中保持中立，但总有一些“诚信”国家背弃约定侵略我们。从建国之初，许多邻国对我国的领土虎视眈眈。并因此爆发了无数场边境冲突......我国先前一次又一次地击退了敌人。但是在朝鲜战争当中，我国只能尽全力帮助盟友，由此容易造成我国部分空虚，很有可能被敌国趁机而入。因此在英勇的志愿军进入朝鲜半岛之前，我们必须加固边境防线，以防不测。"

 PRC_03_TS_FL_R_03: "扩大军备生产"
 PRC_03_TS_FL_R_03_desc: "虽然相对缺少士兵，但是我国总人口数量名列前茅，解决兵力问题只需要多准备一些时日。但若用我们现有的装备去打仗还是远远不够。为了防止各种突发情况，第三次世界大战来临之前我们必须做好充足的准备——扩大军备生产是当今时期的必须之策：如果仅仅征兵而不扩充军备的话，我们的士兵就只能拿着菜刀冲锋。"

 PRC_03_TS_FL_R_04_L: "优先战备生产"
 PRC_03_TS_FL_R_04_L_desc: "经总后勤部统计，不仅仅是战斗装备、人力，连各种军用物资我们准备的都不够充分。如果美国士兵越过三八线的时候我们的军用资源仍然不够充足，那么这场战争我们将处于巨大的困境，这将决定无数场战役的胜利与否。因此，尽管还面临人力问题等多方面困难，我们必须尽快及时地注意军用资源的生产，就算我们得先把其他方面的生产“放一放”……可以笼统地说，军用物资以及装备生产的越多，我们在这场战争中的胜率就越大。"

 PRC_03_TS_FL_R_05_L: "扩建军工"
 PRC_03_TS_FL_R_05_L_desc: "为什么一定要将军工厂内迁？如果我们新建军工厂而旧的仍然未被摧毁，那么我们就会拥有双倍的产能！因此我们更应该抓紧新军工厂的建设与以防止军工厂在战争中被摧毁。即使我们的海军战败，临海的军工被轰炸机光顾，我们新建的军工厂仍然可以源源不断地生产装备。这就是扩建军工的优势所在！"

 PRC_03_TS_FL_R_04_R: "快速转产军工"
 PRC_03_TS_FL_R_04_R_desc: "国家有难，匹夫有责！我们现在应当将部分民用工厂转为军用工厂，以减小军工建设速度不足而拉开的产能差距。现在国家即将面临建国几十年来最为危险的一次灾难！如果国家尊严都被他国践踏，那么人民更不可能过上安稳的生活。因此现在我们急需将部分民用产能快速转型，即使是冒着老百姓生活水平下降的风险。"

 PRC_03_TS_FL_R_05_R: "军工内迁"
 PRC_03_TS_FL_R_05_R_desc: "现在所剩给我们的时间已经不多了，北约军队咄咄逼人，海军舰队不远万里公然违背国际公约进入中国海域，意图逼迫我们妥协！但是，即便他们不为战争而来，也随时可能会因为某个导火索而向我们开战！可能是明天，也可能是后天，北约的导弹就会落在人民祖国的领土。因此，现在的每一分每一秒我们都要去珍惜。建造新的军工设备所花费的时间不是我们能够接受的。为防止两军交战时我国沿岸的军工厂被敌军的轰炸机“光顾”。我们现在急需将现有的军事工业设施向内陆迁移。"

 PRC_03_TS_FL_R_06: "资源动员"
 PRC_03_TS_FL_R_06_desc: "现在国家已经到了最危险的时刻了，而我们的战略资源仍然远远不够。我们此刻唯有进行资源动员方可抵御这场危机。在中国的资源动员体系下，国家便会转化为“战争机器”。在党的统一号召下，全国的资源都将被高度整合，全国一心。将国家潜力转化为战力，铸成我们新一代的长城。以此般众志成城之相抵御美帝国主义的入侵！"

 PRC_03_TS_FL_R_07: "社会氛围宣传"
 PRC_03_TS_FL_R_07_desc: "“舆论的高地，我们不去占领，反动派就会占领！”现代战争早已不止步于兵刃上的交锋，更是会在内部进行舆论和信息战争。中华民族自古以来面对困难便万众一心，虽不惧怕内部叛乱，但在面对强于自己数倍的国家时，投降派依旧有着充足地发展空间。我们需要对社会风气进行大整顿，让我国内部更为团结，整个国家面对敌国入侵时就会进行更为有力的反抗！"

 PRC_03_TS_FL_08: "党政军一体化动员"
 PRC_03_TS_FL_08_desc: "我们仍然远远低估了这场战争的规模，根据国家安全局的报告，北约已经准备好正式下场。我国必须进行党政军一体化型动员：以党作为领导中心、政府进行合理分配、军队进行前线支援，让各个部门能够进行深度整合，形成高效协同的紧急迎战体系。将各个部门的优势转为国家整体优势。以众志成城之势面对敌国的来势汹汹！"

 PRC_03_TS_FL_09: "为和平而战 为人民而战"
 PRC_03_TS_FL_09_desc: "战争在历史中往往被唾弃，即使时间转到现代，发动战争以保障国家安全仍然是各个决议策中的下下策。我国自古以来便热爱和平，在经过百年屈辱之后更是主动在世界上调节国家之间的矛盾。但这样一来就会使帝国主义认为我国仍然同旧中国那样软弱。因此他们会不断地将我国拉入各种泥潭当中，但战争真正波及我们的时候，侵略者就会发现现在不再是拿个大炮便可以称霸整个中国的时代了！新中国将会在烈火中证明自己，并一次又一次的打破帝国主义的啮梦！"

 PRC_03_TS_ED_01: "三讲教育" #######
 PRC_03_TS_ED_01_desc: "改开二十年后，党员干部队伍出现理想信念动摇、纪律松弛、作风不实甚至腐败等问题，亟需通过思想教育统一认识，确保党的十五大精神和跨世纪发展目标的落实。“三讲”教育，讲学习、讲政治、讲正气。以理论武装破解信仰危机，以群众监督遏制权力失范。“三讲”教育将会是是延安整风精神在改革开放新时期的延续，通过思想淬炼与制度约束的结合，强化党在市场经济转型中的领导核心作用。尽管存在执行层面的不足，其仍将对领导干部思想政治素质进行系统性重塑。"

 PRC_03_TS_ED_R_02_L: "严明政治纪律"
 PRC_03_TS_ED_R_02_L_desc: "面对改革开放深化过程中的腐败风险、机构松散及重大灾害考验，中共中央将通过系统性制度的设计与高强度的执纪行动，来强化党的纪律权威。是制度刚性与思想熔铸的双重锻造。从长江洪水中对渎职者的雷霆问责，到政法系统与市场的强行切割，再到70万干部接受党性洗礼——这一年以“断腕”姿态宣告：改革越向深水区，纪律越需成为锚链。"

 PRC_03_TS_ED_R_03_L: "端正干部作风"
 PRC_03_TS_ED_R_03_L_desc: "中央向形式主义与特权开刀，破形式主义以高层为示范，制度细化群众监督是防腐关键。从河南叫停“面子工程”的雷霆之举，到七十万干部接受民主评议的自我革新，再到稽察特派员切断政商勾结的“六不铁律”，这场运动以刮骨疗毒的决心宣告：改革进入深水区，作风即是战斗力。其不仅在于遏制特定时期的歪风，更在于确立“群众监督嵌入”、“责任倒查”等机制，如何避免“运动式治理”与日常党建脱节，仍是将不断延续的命题。"

 PRC_03_TS_ED_R_02_R: "清除不正之风"
 PRC_03_TS_ED_R_02_R_desc: "清除不正之风运动，以“三讲”熔铸思想根基，以“断商令”斩断腐败温床，以“责任制”压实监督链条，重塑党政机关的公信力，其将确立“收支两条线”、“群众监督嵌入”等机制。从河南叫停“面子工程”的雷霆举措，到5.7万市民参与的行风评议，再到青岛清退千万话费的制度创新——这场运动将决绝宣告：改革越向深水区，纪律越需成为定盘星。"

 PRC_03_TS_ED_R_03_R: "统一干部思想"
 PRC_03_TS_ED_R_03_R_desc: "面对改革开放深化过程中的思想多元化和部分领导干部存在的理想信念动摇、作风松散等问题，中共中央通过系统性思想整风与制度革新，在全国范围内开展了以统一干部思想为核心的政治教育活动。干部思想统一工作，本质是思想整风与制度革新双轨并进的产物“三讲”熔铸共识：通过理论武装与批评武器，重建对中央权威的认同责任制固化纪律，以“一案双查”切断地方保护主义与权力寻租链条。这场运动将以群众监督破形式主义高层示范立纪律标杆为21世纪全面从严治党奠定基础。"

