l_simp_chinese:

 # 专属ideas注明TAG按A到Z排序
  
 # 法律 #######
 
 # 兵役法律 #
 PS_LAWS_MO_AVAILABLE_TT: "兵役法律不能被手动修改。"
 # gen
 laws_MO_GEN05: "非军事化模式"
 laws_MO_GEN05_desc: "为了带来和平，我们经历了许多烦扰。如今若停止努力，便永远得不到和平\n——托马斯·艾略特"
 laws_MO_GEN04: "志愿募兵制度"
 laws_MO_GEN04_desc: "想和平的人就得准备战争\n——威吉修斯"
 laws_MO_GEN03: "志愿义务结合"
 laws_MO_GEN03_desc: "国虽大，好战必亡；天下虽安，忘战必危\n——《司马法》"
 laws_MO_GEN02: "适龄义务征召"
 laws_MO_GEN02_desc: "战争让征服者获得对被征服者提出任何要求的权利\n——尤里乌斯·凯撒"
 laws_MO_GEN01: "全体强制义务"
 laws_MO_GEN01_desc: "死神在勇敢者的马刀和刺刀前退却\n——苏沃洛夫"
 
 # 贸易法律 #
 PS_LAWS_TR_AVAILABLE_TT: "贸易法律不能被手动修改。"
 # gen
 laws_TR_GEN05: "完全关闭贸易"
 laws_TR_GEN05_desc: "当外国商品涌入时，我们的工人将沦为乞丐\n——亨利·克莱"
 laws_TR_GEN04: "允许有限贸易"
 laws_TR_GEN04_desc: "任何国家都不应过度依赖外国供应必需品，尤其是军事物资\n——亚历山大·汉密尔顿"
 laws_TR_GEN03: "控制平衡贸易"
 laws_TR_GEN03_desc: "如果一件东西在购买时所费的代价比在家内生产时所费的小，就永远不会想要在家内生产\n——《国富论》"
 laws_TR_GEN02: "自由开放贸易"
 laws_TR_GEN02_desc: "关起门来搞建设不会成功，开放带来进步\n——邓小平"
 laws_TR_GEN01: "完全自由贸易"
 laws_TR_GEN01_desc: "国际贸易是和平最强大的引擎\n——理查德·科布登"
 
 # 国安法律 #
 PS_LAWS_NS_AVAILABLE_TT: "国安法律不能被手动修改。"
 # gen
 laws_NS_GEN05: "人权自由保障"
 laws_NS_GEN05_desc: "人权大于一切！任何干涉他人的行为都是非法的，我们的国民有权利将他们脑海中的想法变为现实。"
 laws_NS_GEN04: "适度公安管理"
 laws_NS_GEN04_desc: "社会安全的保障需要一定量的公安机关，但是享有自由是公民的基本权利，不需要太多的公安机关来干涉公民们的行为举止。"
 laws_NS_GEN03: "规模公安机关"
 laws_NS_GEN03_desc: "任何权利都是有范围的，哪怕是神圣的人权也必须建立在维护社会和谐稳定的基础上，公安机关也要为此扩大规模才能履行维护社会秩序的义务。"
 laws_NS_GEN02: "重度社会监控"
 laws_NS_GEN02_desc: "每个人在公共场合的一举一动都应该受到监控，那怕是社会名流、权贵阶级也要维护国家安全和社会稳定，做到全面监控社会，让那些反社会恐怖分子无任何藏身之地！"
 laws_NS_GEN01: "国家战时管制"
 laws_NS_GEN01_desc: "都些啥玩意？听不懂，反正不利于社会在战时稳定的都跟我的警棍说去吧！"
 
 # 劳工法律 #
 PS_LAWS_LR_AVAILABLE_TT: "劳工法律不能被手动修改。"
 # gen
 laws_LR_GEN05: "工人奴化权利"
 laws_LR_GEN05_desc: "工人只不过是在工厂内的奴隶罢了，厂长可以像奴隶主那样对待工人，反正也只是个货物，谈不上啥人道不人道的。"
 laws_LR_GEN04: "工人有限权利"
 laws_LR_GEN04_desc: "工人们不应该像奴隶那样被过分压榨，但这并不代表我们可以给予工人们过多的权利。"
 laws_LR_GEN03: "工人适当权利"
 laws_LR_GEN03_desc: "工人的权利应与普通人一致，他们都是我们国家的一份子，都不应该享有特权或被压榨。"
 laws_LR_GEN02: "工人充分权利"
 laws_LR_GEN02_desc: "工人们为我们国家的发展做出了重要贡献，我们的飞机、坦克乃至衣服鞋子都是工人们用他们的双手创造的，我们要给工人们充分的权利以肯定他们对国家的贡献"
 laws_LR_GEN01: "工人自由权利"
 laws_LR_GEN01_desc: "没有工人就没有我们今天的生活，我们的一切都是工友同志们给予我们的，他们应该享有至高无上的权利。"
 
 # 民族法律 #
 PS_LAWS_NH_AVAILABLE_TT: "民族法律不能被手动修改。"
 # gen
 laws_NH_GEN05: "放逐少数民族"
 laws_NH_GEN05_desc: "我们并不欢迎少数人在我们的土地上生存，自求多福吧。"
 laws_NH_GEN04: "民族有限权利"
 laws_NH_GEN04_desc: "我们应当给予少数民族一定的权利，但他们毕竟是少数人，也不配有太多的权利。"
 laws_NH_GEN03: "平等公正对待"
 laws_NH_GEN03_desc: "所有人生下来就是平等的，没有人有权力去强迫其他人，少数民族和多数民族都应享有同等权利，民族团结才是正路。"
 laws_NH_GEN02: "优待少数民族"
 laws_NH_GEN02_desc: "毕竟是少数群体，我们应对其有一定的关怀，给他们多一点权利，才能真正实现平等，才能体现我们对少数民族权利的重视。"
 laws_NH_GEN01: "少数民族特权"
 laws_NH_GEN01_desc: "优待少数人，福利多数人！"
 
 # 移民法律 #
 PS_LAWS_IG_AVAILABLE_TT: "移民法律不能被手动修改。"
 # gen
 laws_IG_GEN05: "关闭边境口岸"
 laws_IG_GEN05_desc: "鬼知道那些无家可归的人会对我们的国家干些什么"
 PS_LAWS_IG_GEN05_MODIFIER_ID_TT: "£operatives_extract_intel_texticon 情报泄露概率: 大幅降低"
 PS_LAWS_IG_GEN05_MODIFIER_EC_TT: "£manpower_noncore_texticon 他国人才几乎不会来我国。"
 laws_IG_GEN04: "严格限制审查"
 laws_IG_GEN04_desc: "我们应该尝试开放一些口岸，让一部分对国家发展有用的高技术人才来到我们国家为我们服务。至于那些对我们没用的难民...有啥规定说我们有义务接受这群人？"
 PS_LAWS_IG_GEN04_MODIFIER_ID_TT: "£operatives_extract_intel_texticon 情报泄露概率: 较大降低"
 PS_LAWS_IG_GEN04_MODIFIER_EC_TT: "£manpower_noncore_texticon 一些高级人才会加入我国。"
 laws_IG_GEN03: "适度移民监管"
 laws_IG_GEN03_desc: "劳动力、高技术人才这些都是我们需要的，难民之类的我们也可以给予他们一定的援助，但这些都要进行恰当的监督。"
 PS_LAWS_IG_GEN03_MODIFIER_ID_TT: "£operatives_extract_intel_texticon 情报泄露概率: 略微降低"
 PS_LAWS_IG_GEN03_MODIFIER_EC_TT: "£manpower_noncore_texticon 一部分的劳工会涌入我国。"
 laws_IG_GEN02: "宽松移民限制"
 laws_IG_GEN02_desc: "不需要对那些移民有太多的限制，让大部分有想法的人都能有机会来到我们国家，他们将在这里安居乐业并实现他们的理想生活，又有谁能够阻止其他人追逐梦想呢？"
 PS_LAWS_IG_GEN02_MODIFIER_ID_TT: "£operatives_extract_intel_texticon 情报泄露概率: 略微提高"
 PS_LAWS_IG_GEN02_MODIFIER_EC_TT: "£manpower_noncore_texticon 形形色色的人会进入我国。"
 laws_IG_GEN01: "完全开放边境"
 laws_IG_GEN01_desc: "自由！民主！"
 PS_LAWS_IG_GEN01_MODIFIER_ID_TT: "£operatives_extract_intel_texticon 情报泄露概率: 大幅提高"
 PS_LAWS_IG_GEN01_MODIFIER_EC_TT: "£manpower_noncore_texticon 形形色色的人会进入我国。"