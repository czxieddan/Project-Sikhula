 PRC_focus_reports.1.t: "变革之风"
 PRC_focus_reports.1.desc: "@cnm@cnm@cnm新生开学典礼上，校长站在讲台上，郑重地向全体新生解释着改革的意义。\n@cnm@cnm@cnm“同学们，你们是大学第一批‘并轨招生’的学生。这意味着，你们既是改革的受益者，也是改革的参与者。这项改革的目的，是要建立‘学生上学自己缴纳部分培养费用、毕业生多数人自主择业’的机制。这不仅是与国家经济体制改革相适应，也是与社会主义市场经济的要求相适应。过去的‘统包统分’已经不能满足社会发展的需要了。”\n@cnm@cnm@cnm典礼结束后，李卫国在人群中看到了那个穿着时髦的男生。他正和几个同学热烈地讨论着什么。\n@cnm@cnm@cnm“嘿，李卫国！”男生主动打招呼，“我想通了。这改革其实挺好的。以后我们可以自己选择工作，不再是被分配到哪里就去哪里。我有亲戚在南方做生意，说现在机会可多了！”\n@cnm@cnm@cnm李卫国有些惊讶于他的转变：“但是你不担心找不到工作吗？”\n@cnm@cnm@cnm“有什么好担心的？只要有能力，还怕没出路？ 反正我是不想被分到哪个小县城里呆一辈子。”\n@cnm@cnm@cnm那天晚上，李卫国给家里写了封信。他既诉说对学费的担忧，又解释了招生并轨的意义和好处。\n@cnm@cnm@cnm“爹，娘，”他写道，“这是一个变革的时代，我们有幸站在前沿。虽然现在困难些，但这条路是对的，我会努力走出自己的天地。”"
 PRC_focus_reports.1.a: "变革之风吹满大地"