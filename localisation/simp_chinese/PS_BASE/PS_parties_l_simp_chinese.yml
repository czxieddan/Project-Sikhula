 # PRC
 AUTHORITARIANSOCIALISM_PRC_SCC: "中国特色社会主义"
 AUTHORITARIANSOCIALISM_PRC_SCC_desc: "中国特色社会主义是科学社会主义的基本原则与中国实际相结合的产物，具有鲜明的时代特征和中国特色。中国共产党领导是中国特色社会主义最本质的特征。中国特色社会主义道路，是在中国共产党的领导下，立足基本国情，以经济建设为中心，坚持四项基本原则，坚持改革开放，解放和发展社会生产力，建设中国特色社会主义市场经济、社会主义民主政治、社会主义先进文化、社会主义和谐社会、社会主义生态文明，促进人的全面发展，逐步实现全体人民共同富裕，建设富强、民主、文明、和谐、美丽的社会主义现代化强国。中国特色社会主义道路，是党和人民100年奋斗、创造、积累的根本成就，是引领中国进步、增进人民福祉、实现民族复兴的康庄大道。中国特色社会主义理论体系，即中国共产党把马克思主义与中国实际相结合实现马克思主义中国化的最新理论成果，包括邓小平理论、“三个代表”重要思想、科学发展观以及习近平新时代中国特色社会主义思想。中国特色社会主义是中国共产党对现阶段纲领的概括，其科学涵义是要求把马克思主义的普遍真理同本国的具体实际结合起来，走适合中国特点的道路，逐步实现工业、农业、国防和科学技术现代化，把中国建设成为一个富强、民主、文明、和谐、美丽的社会主义现代化强国，即一方面要坚持马克思主义的基本原理，走社会主义道路；另一方面必须从中国的实际出发，不照抄、照搬别国经验、模式，而是走具有中国特色的路。中国共产党依据毛泽东倡导的马克思主义普遍真理同中国具体实际相结合的原则，总结长期探索所积累的经验，特别是十一届三中全会以来的实践，深刻地认识到建设中国社会主义的规律，在十二大提出“走自己的路，建设有中国特色的社会主义”的科学论断。党的十三大、十四大和十五大对这一论断形成一系列科学观点，制定一系列具体政策、措施。主要内容有：解放思想，实事求是，以实践作为检验真理的唯一标准；中国所要解决的主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，党和国家的工作重点必需转移到以经济建设为中心的社会主义现代化轨道上来；建设社会主义有一个很长的初级阶段，社会主义社会的根本任务是发展生产力，集中力量实现现代化；实行社会主义市场经济；改革是社会主义社会发展的重要动力，对外开放是实现社会主义现代化的必要条件；使社会主义民主制度化、法律化，依法治国，改革和完善国家的政治体制和领导体制；加强社会主义精神文明的建设，坚持四项基本原则与坚持改革开放两个基本点要互相结合，缺一不可；坚持和完善人民代表大会制度和共产党领导的多党合作和政治协商制度；改善和发展社会主义民族关系，加强民族团结；用一国两制来解决国家统一问题；执政党的党风问题关系到党的生死存亡；反对帝国主义、霸权主义、殖民主义、种族主义，维护世界和平。党的十六大认真总结十三届四中全会以来党团结和带领全国各族人民在建设中国特色社会主义的伟大实践中取得的基本经验，号召全党要坚持贯彻党的基本理论、基本路线、基本纲领和基本经验，把各项工作做得更好。为了在学习贯彻“三个代表”重要思想的新高潮中，加深理解十六大的基本精神，增强全面贯彻“三个代表”重要思想的自觉性和坚定性。建设中国特色社会主义是建设中国特色社会主义的新的实践总结和新的理论结晶；是保持与时俱进的精神状态，不断开拓马克思主义理论新境界的新成果；是“三个代表”重要思想的体现，构成建设中国特色社会主义理论的新的体系；建设中国特色社会主义的“基本经验”与基本理论、基本路线、基本纲领具有内在统一性，是科学社会主义理论在当代发展的最新成果。"
 PRC_AUTHORITARIANSOCIALISM_party: "中国共产党"
