l_simp_chinese:
 1998_NAME: "星火燎原"
 1998_DESC: "@cnm@cnm@cnm历史的车轮已经走到了1998年，世纪交替下的地球却不怎么平静。西欧巨变和苏联的解体给整个社会主义世界带来了巨大的打击，亲美党派在俄罗斯的支持率居高不下，即将到来的俄罗斯总统选举或将改变世界格局；中国的改革开放已经持续了20年，中国经济的飞速发展让美国感受到了巨大的威胁，中央军委在海湾战争和新一轮台海危机的刺激下准备进行军改。中国西部的印度、南部的台湾、东边的日本以及北边俄罗斯都有美国势力的存在。美西方在冷战结束后持续扩张势力范围，东德、罗马尼亚等国接连投靠北约，美利坚的势力范围已经横跨整个地球。一场猛烈的山火只需要星星之火，即可燎原。"

 1998_PRC_DESC: "新中国已经诞生了快五十年，五十年前的中国还是一个积贫积弱的落后农业国，中国共产党带领着中国人民重新站在了世界舞台上，改革开放以来的经济成就让世界都为之震撼。江泽民自担任中共总书记后，带领着中国人民在社会主义事业上又上了一个台阶。但新中国的外部环境可不太好，新一轮的台海危机以及海湾战争让中央军委感受到了前所未有的威胁、亲美反华的浪潮在俄国内愈演愈烈、西方国家的虎视眈眈都表明着新中国已经走到了一个新的足以改变整个中华民族的历史十字路口。"