l_simp_chinese:
 power_plant: "发电站"
 power_plant_plural: "发电站"
 power_plant_desc: "此建筑可为所属地区提供§G+20%建筑槽位§!，§G+5%当地资源产出§!，并通过消耗§H燃料§!提供§G+10%建造速度§!。\n\n§R你不能在该地区建造§!§Y$nuclear_reactor_plural$§!和§Y$energy_farm_plural$§!！"
 nuclear_reactor: "核反应堆"
 nuclear_reactor_plural: "核反应堆"
 nuclear_reactor_desc: "此建筑可为所属地区提供§G+40%建筑槽位§!，§G+10%本地资源§!，§G+40%工厂产出§!，以及§G+20%建造速度§!，而且不需要§H燃料§!，但§R建造费用高昂§!。如果核武器被§G启用§!，这座建筑可以生产它们。\n\n§R你将无法在此地区建造§Y$energy_farm_plural$§!和§Y$power_plant_plural$§!§!！"
 energy_farm: "能源农场"
 energy_farm_plural: "能源农场"
 energy_farm_desc: "此建筑可为所属地区提供§G+20%建筑槽位§!和§G+20%工厂产出§!，同时不需要消耗§H燃料§!。\n\n§R你不能在该地区建造§!§Y$nuclear_reactor_plural$§!和§Y$power_plant_plural$§!！"
 office_park: "办公园区"
 office_park_plural: "办公园区"
 office_park_desc: "此建筑可为所属地区提供§G+10%工厂产出§!，并分别基于现有§Y企业价值§!和§Y营业税率§!的§Yx1.5§!提供§GGDP§!和§G税收收入§!。"
 rocket_site: "无人机发射基地"
 rocket_site_plural: "无人机发射基地"
 rocket_site_desc: "该建筑可用于生产和使用无人机。"
 
 infrastructure: "基础设施"
 infrastructure_plural: "基础设施"
 infrastructure_desc: "此建筑将改善所属地区的基础设施状况，提高你在战略要地的后勤能力及你的陆军部队在本地区的移动速度，并提升此地区的基础资源产出。"
 arms_factory: "军用工厂"
 arms_factory_plural: "军用工厂"
 arms_factory_desc: "此建筑将花费§R军用工厂维护费用§!为所属地区提供生产军事装备的工业能力。同时也可视需要转换为§Y民用工厂§!"
 dockyard: "海军船坞"
 dockyard_plural: "海军船坞"
 dockyard_desc: "此建筑将花费§R船坞维护费§!为所属地区提供建造新舰船的工业能力。"
 industrial_complex: "民用工厂"
 industrial_complex_plural: "民用工厂"
 industrial_complex_desc: "此建筑可为所属地区提供生产民用商品和建造新建筑的工业能力，同时根据目前§Y企业价值§!与§Y营业税率§!提供相应的§GGDP§!和§G税收收入§!。同时也可视需要转换为§Y军用工厂§!。"